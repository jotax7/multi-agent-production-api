# docker compose up -d redis phoenix        -> infraestructura (API la corrés local con uvicorn)
# docker compose up -d --build              -> TODO, incluida la API en un contenedor
services:
  redis:
    # Redis STACK (no el redis común): el checkpointer de LangGraph necesita los módulos RedisJSON + RediSearch
    image: redis/redis-stack-server:latest
    ports: ["6379:6379"]
    environment:
      REDIS_ARGS: "--appendonly yes"      # persiste en disco: los jobs pausados sobreviven a un reinicio
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"     # UI + colector OTLP/HTTP (/v1/traces)
      - "4317:4317"     # colector OTLP/gRPC
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes: ["phoenix_data:/mnt/data"]

  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]                       # claves del LLM
    environment:                           # dentro de la red de compose los hosts son los nombres de servicio
      REDIS_URL: redis://redis:6379
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      OUTBOX_PATH: /app/outbox/outbox.jsonl
    depends_on:
      redis: { condition: service_healthy }
      phoenix: { condition: service_started }
    volumes: ["./outbox:/app/outbox"]

volumes:
  redis_data:
  phoenix_data:
